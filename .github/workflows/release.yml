name: Build & Release Conda Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  conda-build-and-upload:
    name: Build & Upload Conda Package (linux-64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniforge / Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: "3.10"
          auto-activate-base: true
          channel-priority: flexible
          channels: conda-forge,bioconda,defaults

      - name: Install build dependencies
        run: |
          conda install -n base -c conda-forge conda-build anaconda-client git -y

      - name: Build Conda Package
        run: |
          mkdir -p ./conda-dist
          conda-build . --output-folder ./conda-dist

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: scardock-util-conda-linux-64
          path: ./conda-dist/linux-64/*
          if-no-files-found: error

      - name: Upload Package to Anaconda Cloud
        if: env.ANACONDA_API_TOKEN != ''
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          echo "Uploading package to Anaconda.org channel: pylyzeng..."
          anaconda --token "$ANACONDA_API_TOKEN" upload --user pylyzeng --label main ./conda-dist/linux-64/scardock-util-* --force
          echo "Package successfully published to Anaconda Cloud!"
